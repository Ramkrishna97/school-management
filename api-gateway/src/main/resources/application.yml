server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: teachers
              uri: lb://teacher-hr-service
              predicates:
                - Path=/api/teachers/**
            - id: timetables
              uri: lb://timetable-substitution-service
              predicates:
                - Path=/api/timetables/**
            - id: substitutions
              uri: lb://timetable-substitution-service
              predicates:
                - Path=/api/substitutions/**
            - id: inventory
              uri: lb://inventory-asset-service
              predicates:
                - Path=/api/inventory/**
            - id: auth
              uri: lb://auth-user-service
              predicates:
                - Path=/api/auth/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
school:
  jwt:
    secret: ${SCHOOL_JWT_SECRET:local-development-secret-change-before-use-1234567890}
management:
  endpoints:
    web:
      exposure:
        include: health,info
