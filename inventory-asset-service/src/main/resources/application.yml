server:
  port: 8083
spring:
  application:
    name: inventory-asset-service
  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
school:
  jwt:
    secret: ${SCHOOL_JWT_SECRET:local-development-secret-change-before-use-1234567890}
management:
  endpoints:
    web:
      exposure:
        include: health,info
